<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Server monitoring{% endblock %} · Linux server monitoring</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="{{ url_for('home') }}">Server monitoring</a>
      <p class="brand-note">Local demo</p>
    </div>
  </header>
  <main class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Linux server monitoring demo. Runs on this machine only.</p>
  </footer>
</body>
</html>
